# health-monitor.conf - settings for the Linux Server Health Monitor
# Plain Bash, read by health-check.sh and make-page.sh.
# No secrets here: the Telegram token stays in telegram.conf.
# Each limit can still be overridden for one run, e.g.:  DISK_WARN=10 ./health-check.sh

# ---------- Limits (percent unless noted) ----------
CPU_WARN=${CPU_WARN:-80}                      # CPU usage warning limit
RAM_WARN=${RAM_WARN:-80}                      # RAM usage warning limit
DISK_WARN=${DISK_WARN:-95}                    # applies to EVERY mounted filesystem (put the number from Step 0 here if you want to keep it)
INODE_WARN=${INODE_WARN:-80}                  # inode usage warning limit (inodes = how many files a disk can hold)
SWAP_WARN=${SWAP_WARN:-50}                    # swap usage warning limit
LOAD_WARN_PER_CORE=${LOAD_WARN_PER_CORE:-2}   # warn if the 1-minute load is above (CPU cores x this number)
SSH_FAIL_WARN=${SSH_FAIL_WARN:-20}            # warn if failed SSH logins in the window are above this
SSH_FAIL_WINDOW=${SSH_FAIL_WINDOW:-1 hour ago}   # how far back to count failed logins

# ---------- Services that must be running ----------
SERVICES=("ssh" "nginx")                      # add names as systemctl knows them; do NOT add mariadb here if MARIADB_CHECK=yes

# ---------- Websites that must answer (HTTP 200-399) ----------
# Replace or extend with your own sites from the Step 0 nginx output, e.g. "http://localhost:8081"
WEBSITES=("http://localhost:8080")            # 8080 is the health page itself, just an example
WEB_TIMEOUT=${WEB_TIMEOUT:-5}                 # seconds to wait for each site before calling it DOWN

# ---------- MariaDB ----------
MARIADB_CHECK=${MARIADB_CHECK:-yes}           # yes = check MariaDB, no = skip it
MARIADB_SERVICE=${MARIADB_SERVICE:-mariadb}   # systemd service name
MARIADB_PING=${MARIADB_PING:-yes}             # yes = also run "mariadb-admin ping"; set no if the ping test in Step 0 failed

# ---------- History for the web page charts ----------
HISTORY_FILE="${HISTORY_FILE:-$HOME/health-monitor/logs/history.csv}"   # CSV that alert.sh appends to
HISTORY_MAX_LINES=${HISTORY_MAX_LINES:-2016}  # keep the newest rows only (2016 rows = 7 days at one row per 5 minutes)
